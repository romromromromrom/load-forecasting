# Configuration unique du pipeline. Toutes les valeurs sont surchargeables.
paths:
  raw_dir: data/raw
  processed_dir: data/processed
  results_dir: data/results
  eco2mix_zip_dir: .                       # les zips eCO2mix sont à la racine du projet
  eco2mix_zip_glob: "eCO2mix_RTE_Annuel-Definitif_*.zip"

temperature:
  enedis_api: "https://opendata.enedis.fr/api/explore/v2.1/catalog/datasets/donnees-de-temperature-et-de-pseudo-rayonnement"
  # Enedis n'expose qu'une fenêtre glissante de 5 ans -> le début 2020 n'existe pas.
  backfill: openmeteo_calibrated           # openmeteo_calibrated | synthetic
  openmeteo_api: "https://archive-api.open-meteo.com/v1/archive"
  synthetic_seed: 42

# Découpage chronologique strict (jamais de shuffle).
split:
  train_end: "2022-12-31"
  val_end: "2023-12-31"
  test_end: "2024-12-31"

# Validation croisée expanding-window : 1 fold = 1 trimestre.
cv:
  first_test_start: "2022-01-01"
  fold_months: 3

# Le forecast du jour D est émis à D 00:00 : la dernière charge connue est D-1 23:00.
# Toute feature dérivée de la charge doit donc avoir un retard >= 24 h.
features:
  min_lag_hours: 24
  max_fallback_weeks: 6
  # Instant d'émission. null = D 00:00 (historique, optimiste). k = dernière heure de D-1 connue :
  # 9 -> prévision émise à D-1 10:00 (comme une vraie J-1) ; lags 24/48 h et moyennes glissantes
  # ancrées en conséquence, SARIMAX et règles adaptatives décalés. Voir RESULTS.md § 3 bis.
  issue_hour: null

weather:
  # "normal"  : température prévue = normale Enedis (mode opérationnel, sans oracle)
  # "perfect" : température réalisée utilisée comme prévision parfaite (borne haute, oracle)
  default_mode: normal

models:
  xgboost:
    n_estimators: 400
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: 5
    random_state: 42
    n_jobs: 2
  random_forest:
    n_estimators: 200
    max_depth: 18
    min_samples_leaf: 5
    max_features: 0.5
    max_samples: 0.6
    random_state: 42
    n_jobs: 2
  sarimax:
    order: [1, 0, 1]
    seasonal_order: [1, 1, 1, 24]
    train_window_days: 84
    maxiter: 40
  hyperparameter_grid:
    xgboost:
      max_depth: [3, 6, 9]
      learning_rate: [0.03, 0.1]
      n_estimators: [200, 500]
    random_forest:
      max_depth: [10, 18, null]
      min_samples_leaf: [2, 10]
      max_features: [0.33, 0.7]
  # scénario 'noisy' : prévision de température = réalisée + bruit AR(1) SYNTHÉTIQUE
  noisy_forecast: {sigma: 1.2, phi: 0.6, seed: 42}

rules:
  covid_years: [2020]                      # années dégradées : écartées des références si possible
  year_end_weeks: [51, 52, 53]
  year_start_weeks: [1, 2]
  baseline_weeks: [48, 49, 50]
  summer_window_weeks_before: 2
  summer_window_weeks_after: 2
  summer_anchor_weeks: 3
