[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rte-load-forecasting-demo"
version = "0.1.0"
description = "Démonstrateur end-to-end de prévision de la consommation électrique française (RTE eCO2mix + Enedis)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=15",
  "scikit-learn>=1.4",
  "xgboost>=2.0",
  "statsmodels>=0.14",
  "holidays>=0.50",
  "requests>=2.31",
  "pyyaml>=6",
  "joblib>=1.3",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.35", "plotly>=5.20", "shap>=0.45"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::FutureWarning", "ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "app", "scripts"]
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
